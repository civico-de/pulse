# pulse dev stack — CiviCRM (civikitchen standalone) + MariaDB + maildev
# + phpMyAdmin.
#
# Usage:
#   cd .docker && docker compose up -d        # first boot: auto-install + provisioning
#
# URLs:  CiviCRM http://localhost:8080 (admin/admin)
#        maildev http://localhost:1080 · phpMyAdmin http://localhost:8081
#
# Re-provision from scratch (re-seeds the profile, re-runs init.d hooks): docker compose down -v && up -d

# Explicit project name: unnamed .docker/ stacks all become one project called
# "docker" and share volumes across checkouts.
name: pulse-dev

services:
  app:
    image: ${CIVIKITCHEN_IMAGE:-ghcr.io/civico-de/civikitchen:standalone}
    # Override CIVIKITCHEN_IMAGE to pin a specific CiviCRM minor for this
    # extension. Always pull so a stale local layer doesn't mask entrypoint fixes.
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      CIVICRM_AUTO_INSTALL: "1"
      CIVICRM_DB_HOST: db
      CIVICRM_DB_NAME: civicrm
      CIVICRM_DB_USER: civicrm
      CIVICRM_DB_PASSWORD: civicrm
      # Must match the host:port opened in the browser (asset URLs).
      CIVIKITCHEN_SITE_URL: "http://localhost:8080"
      CIVIKITCHEN_DEMO_USER: admin
      # Dependencies, config, seed records and API users: profiles/dev/profile.json.
      CIVIKITCHEN_PROFILE: dev
      CIVIKITCHEN_PROFILE_PATH: /civikitchen-profiles
      CIVIKITCHEN_TRUST_EXTERNAL_PROFILES: "1"
      # Outbound mail lands in maildev.
      CIVIKITCHEN_SMTP_HOST: maildev
      CIVIKITCHEN_SMTP_PORT: "1025"
      # Comma-separated; optional sibling extensions go here, not into info.xml.
      CIVIKITCHEN_ENABLE_EXTENSIONS: "pulse"
    volumes:
      - ..:/var/www/html/ext/pulse
      - ./profiles:/civikitchen-profiles:ro
      # Sibling extension example (mount + add to CIVIKITCHEN_ENABLE_EXTENSIONS):
      # - ../../othersibling:/var/www/html/ext/othersibling
      # First-boot hooks, run after install + ext:enable in lexical order. See init.d/README.md.
      - ./init.d:/civikitchen-init.d:ro

  db:
    image: mariadb:11.4
    # Civi\Test's schema rebuild creates triggers as the app user; with binary
    # logging the server refuses that unless it trusts non-SUPER creators.
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: civicrm
      MYSQL_USER: civicrm
      MYSQL_PASSWORD: civicrm
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  maildev:
    # Pinned: the 3.x pre-releases ship a healthcheck that queries a route
    # the app answers with 404, so the container never becomes healthy.
    image: maildev/maildev:2.2.1
    ports:
      - "1080:1080"
      - "1025:1025"

  phpmyadmin:
    # Pinned: a floating tag makes a run unreproducible.
    image: phpmyadmin/phpmyadmin:5.2.3
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db

volumes:
  db-data:
